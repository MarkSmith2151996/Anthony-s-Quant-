version: "3.9"

services:
  berjquant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: berjquant
    restart: unless-stopped
    volumes:
      # Persist data and results outside the container
      - ../data:/app/data
      - ../results:/app/results
      - ../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    # Override CMD as needed:
    #   docker compose run berjquant python run_pipeline.py
    #   docker compose run berjquant pytest tests/ -v
